name: Python package

on:
  push:
    branches: [ master, develop ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Mapped to tox envs by the [gh-actions] section of tox.ini:
        #   3.10 -> mopidy3, 3.13 -> mopidy4
        python-version: ["3.10", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system dependencies (GObject / GStreamer)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgirepository-2.0-dev libgirepository1.0-dev libcairo2-dev pkg-config \
          gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good
    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install "tox>=4" tox-gh-actions
    - name: Run tests
      run: tox

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - uses: pre-commit/action@v3.0.1
    - name: Check MANIFEST.in
      run: pipx run check-manifest

  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    # Publish to PyPI on version tags, once tests and lint pass.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test, lint, build ]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
