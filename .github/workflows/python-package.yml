name: Python package

on:
  push:
    branches: [ master, develop ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test-mopidy3:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.10"
    - name: Install system dependencies (GObject / GStreamer)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgirepository-2.0-dev libgirepository1.0-dev libcairo2-dev pkg-config \
          gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good
    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install "tox>=4"
    - name: Run tests
      run: tox -e mopidy3

  test-mopidy4:
    # Mopidy 4 needs Python >= 3.13 and GStreamer >= 1.26.2, which
    # Ubuntu 24.04 lacks; Debian trixie ships both.
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
    - name: Install system dependencies (Python, GObject / GStreamer, tox)
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates git python3 python3-venv python3-pip python3-gi tox \
          gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good
    - uses: actions/checkout@v7
    - name: Run tests
      run: tox -e mopidy4

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - uses: pre-commit/action@v3.0.1
    - name: Check MANIFEST.in
      run: pipx run check-manifest

  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Check tag matches package version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "${GITHUB_REF_NAME#v}" != "$pkg_version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg_version"
          exit 1
        fi
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    # Publish to PyPI on version tags, once tests and lint pass.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test-mopidy3, test-mopidy4, lint, build ]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
