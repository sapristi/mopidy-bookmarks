[metadata]
name = Mopidy-Bookmarks
version = 0.1.4
url = https://github.com/sapristi/mopidy-bookmarks
author = Mathias Millet
author_email = mathiasmillet@gmail.com
license = Apache License, Version 2.0
license_file = LICENSE
description = Provides bookmarks functionalities to mopidy.
long_description = file: README.rst
classifiers =
    Environment :: No Input/Output (Daemon)
    Intended Audience :: End Users/Desktop
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Topic :: Multimedia :: Sound/Audio :: Players


[options]
zip_safe = False
include_package_data = True
packages = find:
python_requires = >= 3.7
install_requires =
    Mopidy >= 3.0.0
    Pykka >= 2.0.1
    setuptools
    peewee >= 3.10.0

[options.extras_require]
lint =
    check-manifest
    pre-commit
    ruff
release =
    twine
    wheel
test =
    pytest
    pytest-cov
    tox
dev =
    %(lint)s
    %(release)s
    %(test)s


[options.packages.find]
exclude =
    tests
    tests.*


[options.entry_points]
mopidy.ext =
    bookmarks = mopidy_bookmarks:Extension


