[tox]
envlist = mopidy3, mopidy4
requires =
    tox>=4

[gh-actions]
python =
    3.10: mopidy3
    3.13: mopidy4

[flake8]
max-line-length = 160

[testenv]
sitepackages = true
commands =
    python -m pytest \
        --basetemp={envtmpdir} \
        --cov=mopidy_bookmarks --cov-report=term-missing \
        {posargs}

[testenv:mopidy3]
description = Test against Mopidy 3.4.2 (last 3.x)
# NOTE: needs GStreamer/gi system libs (sitepackages = true inherits them).
# CI uses Python 3.10; locally any Python with gi works (e.g. 3.14).
base_python = python3
deps =
    Mopidy==3.4.2
    Pykka>=2.0.1,<4
    Tornado>=6,<7
    peewee>=3.10.0
    setuptools<81
    pytest
    pytest-cov
extras = test

[testenv:mopidy4]
description = Test against Mopidy 4.0.4
base_python = python3
deps =
    Mopidy==4.0.4
    Pykka>=4.1
    Tornado>=6.4
    peewee>=3.10.0
    pytest
    pytest-cov
extras = test

[testenv:black]
deps = .[lint]
commands = python -m black --check .

[testenv:check-manifest]
deps = .[lint]
commands = python -m check_manifest

[testenv:flake8]
deps = .[lint]
commands = python -m flake8 --show-source --statistics
